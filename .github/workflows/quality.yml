name: Store regression checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test -- --run
      - run: npm audit --omit=dev --audit-level=critical
      - run: npx tsc --noEmit -p convex/tsconfig.json
      - run: npm run check:launch
      - run: npm run build
        env:
          VITE_CONVEX_URL: https://kindly-herring-709.convex.cloud
          VITE_CONVEX_SITE_URL: https://kindly-herring-709.convex.site
